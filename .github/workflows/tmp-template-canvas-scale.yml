name: Temporary template canvas scale patch

on:
  push:
    branches:
      - fix/template-canvas-scaling

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply template canvas scaling patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/template-canvas-scaling
          fetch-depth: 0
      - name: Apply patch
        run: python tmp_canvas_scale_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/template-maker.css js/main.js
          git commit -m "Fix template canvas browser scaling"
          git push origin HEAD:fix/template-canvas-scaling
