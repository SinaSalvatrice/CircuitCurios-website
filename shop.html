    // whereas the editor scales a fully laid-out canvas via transform.

    const applyTemplateCanvasScale = scale => {
      if (!Number.isFinite(scale) || scale <= 0) return;
      const canvas = document.querySelector(
        '.cc-template-page > .cc-template-canvas'
      );
      if (!canvas) return;
      const host = canvas.parentElement;
      if (!host) return;

      const designHeight = parseFloat(style.getPropertyValue('--cc-design-height'));

      // only its *visual* height so the footer and following page content do
      // not leave a large gap or overlap the scaled artwork.

      const displayHeight = designHeight * scale;

    };


    // Calculate fully opaque RGB once, then apply the configured intensity.
    // CSS text-shadow/box-shadow/glow never needs a visible rectangular overlay.
    const hoverGlowRGBA = (raw, alpha) => {
      const value = String(raw || '#ffffff').trim();
      const hex = value.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      let channels = [255, 255, 255], sourceAlpha = 1;
      if (hex) {
        const full = hex[1].length === 3
          ? [...hex[1]].map(c => c + c).join('') : hex[1];
        channels = [0, 2, 4].map(i => parseInt(full.slice(i, i + 2), 16));
      } else {
        const rgb = value.match(/^rgba?\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)(?:\s*,\s*([\d.]+))?\s*\)$/i);
        if (rgb) {
          channels = rgb.slice(1, 4).map(n => Math.round(Number(n)));
          sourceAlpha = Number(rgb[4] ?? 1);
        }
      }
      return 'rgba(' + channels.join(',') + ',' +
        Math.max(0, Math.min(1, alpha * sourceAlpha)).toFixed(3) + ')';
    };

    // Hover effects use individual transform properties so they compose with
    // the editor's existing CSS transform and viewport transitions.
    // Click/Press remains independent; touch devices do not synthesize hover.
    // DOM patches can add a hover to an existing node or change its effects.
    // Rebind only changed sources; leave all other running animations intact.
    const hoverBindings = new Map();
    // Do not gate registration on the primary input device. A touchscreen
    // laptop/Android device may gain a mouse after the page has loaded, while
    // (hover: hover) still reports false for the primary touch pointer.
    // Ignore only actual touch events; preserve mouse, pen and editor events.
    window.ccRefreshTemplateHovers = () => {
      const live = new Set(document.querySelectorAll('[data-cc-hover]'));
      for (const [source, binding] of hoverBindings) {
        if (live.has(source) && binding.serialized === source.dataset.ccHover) {
          continue;
        }
        binding.dispose();
        hoverBindings.delete(source);
      }
      live.forEach(source => {
        if (hoverBindings.has(source)) return;
        const serialized = source.dataset.ccHover;
        let actions = [];
        try { actions = JSON.parse(serialized || '[]'); }
        catch (_) { return; }
        const disposers = [];

        actions.filter(action => action.enabled !== false).forEach(action => {
          let active = null;
          let baseline = null;
          let underlineTarget = null;
          const effects = new Set(Array.isArray(action.hoverEffects)
            ? action.hoverEffects : ['lift']);
          const clearUnderline = () => {
            if (underlineTarget) {
              underlineTarget.classList.remove('cc-tm-hover-underlined');
              underlineTarget = null;
            }
          };
          const targetOf = () => {
            if (action.hoverTarget === 'other') {
              return action.target ? document.getElementById(action.target) : null;
            }
            if (action.hoverTarget === 'group') {
              return source.closest('.cc-tm-transition-group') || source;
            }
            return source;
          };
          const snapshot = target => {
            const css = getComputedStyle(target);
            return {
              translate: css.translate === 'none' ? '0px 0px' : css.translate,
              scale: css.scale === 'none' ? '1' : css.scale,
              rotate: css.rotate === 'none' ? '0deg' : css.rotate,
              opacity: css.opacity,
              boxShadow: css.boxShadow,
              textShadow: css.textShadow,
              filter: css.filter,
            };
          };
          const play = entering => {
            const target = targetOf();
            if (!target || !target.animate) return;
            if (effects.has('underline')) {
              if (underlineTarget && underlineTarget !== target) clearUnderline();
              target.classList.toggle('cc-tm-hover-underlined', entering);
              underlineTarget = entering ? target : null;
            }
            // Capture the original CSS once, before any filled animation.
            if (!baseline || baseline.target !== target) {
              baseline = { target, style: snapshot(target) };
            }
            const start = snapshot(target);
            if (active) active.cancel();
            const end = { ...baseline.style };
            // Scroll positioning belongs to the clip, not the hover animation.
            // Never freeze its translate when scrolling/hovering over children.
            const scrollChild = target.parentElement?.hasAttribute(
              'data-cc-clip-scroll-content');
            const scrollTranslate = 'calc(0px - var(--cc-scroll-x)) ' +
              'calc(0px - var(--cc-scroll-y))';
            const movesOnHover = effects.has('lift') || effects.has('slide');
            if (!movesOnHover) {
              // Effects such as glow/fade/scale must not capture the clip's
              // translate, or the hovered element jumps while scrolling.
              delete start.translate;
              delete end.translate;
            } else if (scrollChild) {
              // Keep the scroll-origin dynamic for the entire hover animation.
              start.translate = scrollTranslate;
              end.translate = scrollTranslate;
            }
            if (entering) {
              const distance = Math.max(0, Math.min(200, Number(action.hoverDistance ?? 8)));
              let x = 0, y = 0;
              if (effects.has('lift')) y -= distance;
              if (effects.has('slide')) {
                const direction = action.hoverDirection || 'right';
                if (direction === 'left') x -= distance;
                else if (direction === 'up') y -= distance;
                else if (direction === 'down') y += distance;
                else x += distance;
              }
              if (movesOnHover) {
                end.translate = scrollChild
                  ? 'calc(' + x + 'px - var(--cc-scroll-x)) ' +
                    'calc(' + y + 'px - var(--cc-scroll-y))'
                  : x + 'px ' + y + 'px';
              }
              if (effects.has('scale'))
                end.scale = String(Math.max(.5, Math.min(2, Number(action.hoverScale ?? 1.05))));
              if (effects.has('tilt'))
                end.rotate = String(Math.max(-45, Math.min(45, Number(action.hoverTilt ?? 4)))) + 'deg';
              if (effects.has('fade'))
                end.opacity = String(Math.max(0, Math.min(1, Number(action.hoverOpacity ?? .7))));
              if (effects.has('glow')) {
                const intensity = Math.max(0, Math.min(1,
                  Number(action.hoverGlowIntensity ?? .85)));
                const blur = Math.max(0, Math.min(150, Number(action.hoverGlowBlur ?? 24)));
                const core = Math.max(0, Math.min(50, Number(action.hoverGlowSpread ?? 3)));
                const color = action.hoverGlowColor || '#ffffff';
                const strong = hoverGlowRGBA(color, intensity);
                const soft = hoverGlowRGBA(color, intensity * .5);
                const kind = target.getAttribute('data-cc-element-kind');
                if (kind === 'text') {
                  // Text-shadow follows each glyph, including counters and letter edges.
                  const layers = [
                    '0 0 ' + core + 'px ' + strong,
                    '0 0 ' + blur + 'px ' + strong,
                    '0 0 ' + (blur * 1.7) + 'px ' + soft,
                  ];
                  end.textShadow = (baseline.style.textShadow === 'none' ? '' :
                    baseline.style.textShadow + ', ') + layers.join(', ');
                } else if (kind === 'image' || kind === 'icon') {
                  // Alpha-based imagery needs a silhouette glow, not a box.
                  const halo = 'drop-shadow(0 0 ' + Math.max(1, blur / 2) +
                    'px ' + strong + ') drop-shadow(0 0 ' + Math.max(1, blur) +
                    'px ' + soft + ')';
                  end.filter = (baseline.style.filter === 'none' ? '' :
                    baseline.style.filter + ' ') + halo;
                } else {
                  end.boxShadow = (baseline.style.boxShadow === 'none' ? '' :
                    baseline.style.boxShadow + ', ') + '0 0 ' + blur + 'px ' +
                    core + 'px ' + strong;
                }
              }
            }
            const duration = hostWindow.matchMedia?.('(prefers-reduced-motion: reduce)').matches
              ? 0 : Math.max(0, Math.min(5000, Number(action.durationMs ?? 250)));
            active = target.animate([start, end], {
              duration, delay: entering ? Math.max(0, Number(action.delayMs || 0)) : 0,
              easing: easingValue(action.hoverEasing || 'easeOut'),
              fill: 'forwards'
            });
          };
          const enter = event => {
            if (event.pointerType === 'touch') return;
            play(true);
          };
          const leave = event => {
            if (event.pointerType === 'touch') return;
            if (action.hoverReverse !== false) play(false);
          };
          source.addEventListener('pointerenter', enter);
          source.addEventListener('pointerleave', leave);
          disposers.push(() => {
            source.removeEventListener('pointerenter', enter);
            source.removeEventListener('pointerleave', leave);
            // Cancel filled animations when an effect is edited or removed.
            if (active) active.cancel();
            clearUnderline();
          });
        });
        hoverBindings.set(source, {
          serialized,
          dispose: () => disposers.forEach(dispose => dispose()),
        });
      });
    };
    window.ccRefreshTemplateHovers();

    // Animation groups share one clock. Their tracks remain independently
    // editable elements and keep their exact world-space positions.
    const animationGroupStates = new WeakMap();
    const playAnimationGroup = async (group) => {
      const previous = animationGroupStates.get(group);
      if (previous) {
        previous.cancelled = true;
        previous.animations.forEach(a => a.cancel());
      }
      const state = { cancelled: false, animations: new Set() };
      animationGroupStates.set(group, state);
      let config = {};
      try { config = JSON.parse(group.dataset.ccTransition || '{}'); } catch (_) {}
      const tracks = Array.from(group.querySelectorAll('[data-cc-element-kind]'))
        .filter(e => e.closest('[data-cc-animation-controller]') === group);
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const start = async () => {
        const tasks = [];
        for (const track of tracks) {
          if (state.cancelled) return;
          let t = {};
          try { t = JSON.parse(track.dataset.ccTransition || '{}'); } catch (_) {}
          const delay = Math.max(0, Number(t.delayMs || 0));
          const duration = Math.max(1, Number(t.durationMs || config.durationMs || 350));
          const easing = t.easing === 'linear' ? 'linear' :
            t.easing === 'easeIn' ? 'ease-in' : t.easing === 'easeInOut' ? 'ease-in-out' : 'ease-out';
          const direction = t.direction || 'bottom';
          const distance = Math.max(0, Number(t.distance || 32));
          const x = direction === 'left' ? -distance : direction === 'right' ? distance : 0;
          const y = direction === 'top' ? -distance : direction === 'bottom' ? distance : 0;
          const effect = t.effect || 'fadeSlide';
          const fade = ['fade','fadeSlide','rise','blur'].includes(effect);
          const moving = ['slide','fadeSlide','rise'].includes(effect);
          const texts = (() => { try { return JSON.parse(track.dataset.ccAnimationTexts || '[]').filter(s => typeof s === 'string'); } catch (_) { return []; } })();
          const label = track.matches('.cc-tm-text') ? (track.querySelector(':scope > span') || track) : track;
          if (texts.length > 0) label.textContent = texts[0];
          const playTrack = async () => {
            if (['imageSequenceFade', 'imageSequenceSwoop'].includes(t.effect)) {
              track.removeAttribute('data-cc-transition-pending');
              await runImageSequence(track, t, state);
              return;
            }
            if (delay) await sleep(delay);
            if (state.cancelled) return;
            if (track.animate && t.enabled !== false) {
              const frames = [
                { opacity: fade ? 0 : 1, transform: moving ? 'translate(' + x + 'px,' + y + 'px)' : 'none' },
                { opacity: 1, transform: 'none' },
              ];
              const animation = track.animate(frames, { duration, easing, fill: 'both' });
              state.animations.add(animation);
              track.removeAttribute('data-cc-transition-pending');
              try { await animation.finished; } catch (_) {}
              if (state.cancelled) return;
              animation.cancel();
            } else {
              track.removeAttribute('data-cc-transition-pending');
            }
            if (texts.length > 1) {
              const hold = Math.max(150, Number(t.sequenceHoldMs || config.sequenceHoldMs || 2200));
              for (let index = 1; index < texts.length && !state.cancelled; index++) {
                await sleep(hold);
                if (state.cancelled) return;
                label.textContent = texts[index];
                if (label.animate) {
                  const a = label.animate([{opacity:0.2},{opacity:1}], {duration,easing});
                  state.animations.add(a);
                  try { await a.finished; } catch (_) {}
                }
              }
            }
          };
          // Start all tracks on one clock; the individual delay controls offset.
          tasks.push(playTrack());
        }
        await Promise.all(tasks);
      };
      const groupDelay = Math.max(0, Number(config.delayMs || 0));
      if (groupDelay) await sleep(groupDelay);
      do {
        if (state.cancelled) return;
        await start();
        if (!config.loop || state.cancelled) return;
        await sleep(Math.max(0, Number(config.loopPauseMs || 0)));
      } while (!state.cancelled);
    };
    const groupObservers = new Map();
    window.ccRefreshTemplateAnimationGroups = () => {
      document.querySelectorAll('[data-cc-animation-controller]').forEach(group => {
        const config = (() => { try { return JSON.parse(group.dataset.ccTransition || '{}'); } catch (_) { return {}; } })();
        const fingerprint = JSON.stringify(config) +
          Array.from(group.querySelectorAll('[data-cc-element-kind]'))
            .map(e => (e.dataset.ccTransition || '') + (e.dataset.ccAnimationTexts || '')).join('|');
        if (group.dataset.ccAnimationFingerprint === fingerprint) return;
        group.dataset.ccAnimationFingerprint = fingerprint;
        const existing = groupObservers.get(group);
        if (existing) existing.disconnect();
        if (config.trigger === 'enterViewport') {
          const observer = new IntersectionObserver(entries => {
            if (entries.some(e => e.isIntersecting)) {
              void playAnimationGroup(group);
              if (config.once !== false && !config.loop) observer.disconnect();
            }
          }, {threshold: 0.1});
          const marker = group.previousElementSibling;
          const target = marker?.getAttribute('data-cc-group-trigger') === group.id
              ? marker : group;
          observer.observe(target);
          groupObservers.set(group, observer);
        } else {
          requestAnimationFrame(() => void playAnimationGroup(group));
        }
      });
    };
    window.ccRefreshTemplateAnimationGroups();

    const transitionControllers = new WeakMap();

    const transitionConfig = element => {
      try {
        const config = JSON.parse(element.dataset.ccTransition || '{}');
        return config.enabled ? config : null;
      } catch (_) {
        return null;
      }
    };

    const transitionStates = (element, config) => {
      const distance = Number(config.distance || 32);
      const effect = config.effect || 'fadeSlide';
      const direction = config.direction || 'bottom';
      const rotation =
        getComputedStyle(element).getPropertyValue('--cc-rotation').trim() ||
        '0rad';
      const parsedOpacity = Number.parseFloat(getComputedStyle(element).opacity);
      const targetOpacity = Number.isFinite(parsedOpacity) ? parsedOpacity : 1;
      let x = 0;
      let y = 0;
      if (direction === 'left') x = -distance;
      if (direction === 'right') x = distance;
      if (direction === 'top') y = -distance;
      if (direction === 'bottom') y = distance;
      const moves = effect === 'slide' || effect === 'fadeSlide' || effect === 'rise';
      const fades = effect === 'fade' || effect === 'fadeSlide' || effect === 'rise' || effect === 'blur' || effect === 'bounce';
      const scale = effect === 'scale' ? Number(config.scaleFrom || .96) : 1;
      let startClip = 'inset(0)';
      let endClip = 'inset(0)';
      if (effect === 'reveal') {
        startClip = 'inset(100% 0 0 0)';
        if (direction === 'left') startClip = 'inset(0 100% 0 0)';
        if (direction === 'right') startClip = 'inset(0 0 0 100%)';
        if (direction === 'top') startClip = 'inset(0 0 100% 0)';
        if (element.hasAttribute('data-cc-transition-group')) {
          const style = getComputedStyle(element);
          const number = name => parseFloat(style.getPropertyValue(name)) || 0;
          const left = number('--cc-group-x'), top = number('--cc-group-y');
          const width = number('--cc-group-width'), height = number('--cc-group-height');
          const right = element.clientWidth - left - width;
          const bottom = element.clientHeight - top - height;
          const clip = (t, r, b, l) => 'inset(' + [t, r, b, l].map(n => n + 'px').join(' ') + ')';
          endClip = clip(top, right, bottom, left);
          startClip = clip(top + height, right, bottom, left);
          if (direction === 'left') startClip = clip(top, right + width, bottom, left);
          if (direction === 'right') startClip = clip(top, right, bottom, left + width);
          if (direction === 'top') startClip = clip(top, right, bottom + height, left);
        }
      }
      return {
        start: {
          opacity: fades ? 0 : targetOpacity,
          transform: 'rotate(' + rotation + ') translate(' + (moves ? x : 0) + 'px,' + (moves ? y : 0) + 'px) scale(calc(var(--cc-element-scale, 1) * ' + scale + '))',
          filter: effect === 'blur' ? 'blur(14px)' : 'none',
          ...(effect === 'reveal' ? { clipPath: startClip } : {})
        },
        end: {
          opacity: targetOpacity,
          transform: 'rotate(' + rotation + ') translate(0px,0px) scale(var(--cc-element-scale, 1))',
          filter: 'none',
          ...(effect === 'reveal' ? { clipPath: endClip } : {})
        }
      };
    };

    const runAnimation = async (controller, target, frames, options, release = false) => {
      if (controller.cancelled) return;
      if (!target.animate) {
        target.removeAttribute('data-cc-transition-pending');
        return;
      }
      const animation = target.animate(frames, options);
      // Reveal only after its animation has been installed, never before.
      target.removeAttribute('data-cc-transition-pending');
      // Replace the previous loop endpoint, including any retained reveal mask.
      controller.animations.forEach(previous => previous.cancel());
      controller.animations.clear();
      controller.animations.add(animation);
      try { await animation.finished; } catch (_) {}
      // The visible endpoint is the element's own CSS. Keeping a filled reveal
      // animation would permanently clip its exported shadow at the box edge.
      if (release || controller.cancelled) {
        animation.cancel();
        controller.animations.delete(animation);
      }
    };

    const cancelTransition = element => {
      const controller = transitionControllers.get(element);
      if (!controller) return;
      controller.cancelled = true;
      controller.animations.forEach(animation => animation.cancel());
      controller.animations.clear();
      transitionControllers.delete(element);
      if (element.classList.contains('cc-gallery-sequence')) {
        // Never expose the underlying 3-column gallery when playback stops.
        // Keep the first texture visible until the sequence starts again.
        element.querySelectorAll('.cc-tm-gallery-field').forEach((field, index) => {
          field.style.opacity = index === 0 ? '1' : '0';
        });
      }
    };

    // Keep an opaque image underneath the incoming image for the entire fade.
    // A fade-out-to-background is not a crossfade.
    const runImageSequence = async (element, config, controller) => {
      const fields = Array.from(element.querySelectorAll('.cc-tm-gallery-field'));
      if (!fields.length) return;
      const duration = Math.max(0, Number(config.durationMs ?? 350));
      const hold = Math.max(0, Number(config.sequenceHoldMs ?? 2200));
      const delay = Math.max(0, Number(config.delayMs ?? 0));
      const pause = Math.max(0, Number(config.loopPauseMs ?? 0));
      const loop = config.loop === true;
      const easing = easingValue(config.easing);

      element.classList.add('cc-gallery-sequence');
      fields.forEach((field, index) => {
        field.style.opacity = index === 0 ? '1' : '0';
      });
      element.dataset.ccSequenceIndex = '0';
      document.dispatchEvent(new CustomEvent('cc:sequence-frame', {
        detail: { sourceId: element.id, index: 0 }
      }));
      // Keep the first frame fully visible while loading and before playback.
      if (delay > 0) await wait(delay);
      if (controller.cancelled || fields.length === 1 || !Element.prototype.animate) return;

      let current = 0;
      do {
        if (controller.cancelled) return;
        if (hold > 0) await wait(hold);
        if (controller.cancelled) return;

        const next = (current + 1) % fields.length;
        const incoming = fields[next];
        const outgoing = fields[current];
        // Keep the outgoing texture visible until the incoming image has
        // decoded; never animate an empty frame or expose the background.
        const nextImage = incoming.querySelector('img');
        if (nextImage) {
          try {
            if (typeof nextImage.decode === 'function') {
              await nextImage.decode();
            } else if (!nextImage.complete) {
              await new Promise((resolve) => {
                nextImage.addEventListener('load', resolve, { once: true });
                nextImage.addEventListener('error', resolve, { once: true });
              });
            }
          } catch (_) {}
          if (!nextImage.naturalWidth) return;
        }
        if (controller.cancelled) return;
        // Both layers occupy the same box. Never fade the outgoing layer to
        // transparent before the incoming one has become fully opaque.
        incoming.style.opacity = '0';
        const swoop = config.effect === 'imageSequenceSwoop';
        const animation = incoming.animate(
          swoop
            ? [{ opacity: 0, transform: 'translateX(36px) scale(.96)' },
               { opacity: 1, transform: 'translateX(0) scale(1)' }]
            : [{ opacity: 0 }, { opacity: 1 }],
          { duration, easing, fill: 'both' },
        );
        controller.animations.add(animation);
        try { await animation.finished; } catch (_) {}
        controller.animations.delete(animation);
        if (controller.cancelled) {
          animation.cancel();
          return;
        }
        incoming.style.opacity = '1';
        animation.cancel(); // Remove the filled animation after persisting state.
        outgoing.style.opacity = '0';
        current = next;
        element.dataset.ccSequenceIndex = String(current);
        document.dispatchEvent(new CustomEvent('cc:sequence-frame', {
          detail: { sourceId: element.id, index: current }
        }));

        if (!loop && current === fields.length - 1) return;
        if (loop && current === 0 && pause > 0) await wait(pause);
      } while (!controller.cancelled);
    };

    const runGenericTransition = async (element, config, controller) => {
      const duration = Math.max(0, Number(config.durationMs || 350));
      const delay = Math.max(0, Number(config.delayMs || 0));
      const pause = Math.max(0, Number(config.loopPauseMs || 0));
      const loop = config.loop === true;
      const easing = config.effect === 'bounce' ? easingValue('overshoot') : easingValue(config.easing);
      const states = transitionStates(element, config);
      const options = { duration, easing, fill: 'forwards' };
      if (delay > 0) await wait(delay);
      do {
        if (controller.cancelled) return;
        await runAnimation(controller, element, [states.start, states.end], options, true);
        if (!loop || controller.cancelled) return;
        if (pause > 0) await wait(pause);
        await runAnimation(controller, element, [states.end, states.start], options);
        if (pause > 0) await wait(pause);
      } while (!controller.cancelled);
    };

    const startTransition = (element, config) => {
      cancelTransition(element);
      const controller = { cancelled: false, animations: new Set() };
      transitionControllers.set(element, controller);
      const runner = ['imageSequenceFade', 'imageSequenceSwoop'].includes(config.effect) ? runImageSequence(element, config, controller) : runGenericTransition(element, config, controller);
      runner.catch(() => {});
    };

    const transitionRegistrations = new Map();
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        for (const [element, registration] of transitionRegistrations) {
          if (registration.target !== entry.target) continue;
          const config = registration.config;
          if (entry.isIntersecting) {
            startTransition(element, config);
            if (config.once !== false && config.loop !== true) observer.unobserve(entry.target);
          } else if (config.once === false || config.loop === true) {
            cancelTransition(element);
          }
        }
      });
    }, { threshold: .12 });

    // Inspector edits register only new/changed transitions. Existing HTML,
    // iframes and unchanged animations keep their current playback state.
    window.ccRefreshTemplateTransitions = () => {
      window.ccRefreshTemplateAnimationGroups?.();
      const elements = Array.from(document.querySelectorAll('[data-cc-transition]'))
        .filter(element => !element.closest('[data-cc-animation-controller]') &&
          !element.hasAttribute('data-cc-animation-controller'));
      const current = new Set(elements);
      for (const [element, registration] of transitionRegistrations) {
        if (current.has(element)) continue;
        observer.unobserve(registration.target);
        cancelTransition(element);
        element.removeAttribute('data-cc-transition-pending');
        transitionRegistrations.delete(element);
      }
      elements.forEach(element => {
        const source = element.dataset.ccTransition;
        const marker = element.previousElementSibling;
        const target = element.hasAttribute('data-cc-transition-group')
          ? (marker?.getAttribute('data-cc-group-trigger') === element.id ? marker : null) : element;
        if (!target) {
          element.removeAttribute('data-cc-transition-pending');
          return;
        }
        const previous = transitionRegistrations.get(element);
        if (previous && previous.source === source && previous.target === target) return;
        if (previous) {
          observer.unobserve(previous.target);
          cancelTransition(element);
          transitionRegistrations.delete(element);
        }
        const config = transitionConfig(element);
        if (!config) {
          element.removeAttribute('data-cc-transition-pending');
          return;
        }
        // Prepare the initial state immediately, including inspector edits.
        const sequence = ['imageSequenceFade', 'imageSequenceSwoop'].includes(config.effect);
        const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
        if (!sequence && !reducedMotion) {
          element.setAttribute('data-cc-transition-pending', '1');
        } else {
          element.removeAttribute('data-cc-transition-pending');
        }
        const registration = { source, config, target };
        transitionRegistrations.set(element, registration);
        if (config.trigger === 'pageLoad') {
          requestAnimationFrame(() => {
            if (transitionRegistrations.get(element) === registration) startTransition(element, config);
          });
        } else {
          observer.observe(target);
        }
      });
    };
    window.ccRefreshTemplateTransitions();
  })();
  </script>
</main>
