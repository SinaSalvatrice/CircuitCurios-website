<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CircuitCurios GrapesJS Editor</title>
  <link rel="stylesheet" href="node_modules/grapesjs/dist/css/grapes.min.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="app-shell">
    <header class="editor-toolbar">
      <div class="editor-brand">
        <span class="editor-mark">CC</span>
        <div class="editor-brand-copy">
          <strong>CircuitCurios · GrapesJS Editor</strong>
          <span id="repo-path">Website-Repo</span>
        </div>
        <span class="engine-badge">GrapesJS 0.23.6</span>
      </div>

      <div class="editor-page-tools">
        <label for="page-select">Seite</label>
        <select id="page-select" aria-label="Seite auswählen"></select>
      </div>

      <div class="editor-device-tools" aria-label="Vorschaugröße">
        <button type="button" data-device="Desktop" class="is-active">Desktop</button>
        <button type="button" data-device="Tablet">Tablet</button>
        <button type="button" data-device="Mobil">Mobil</button>
      </div>

      <div class="editor-actions">
        <button type="button" data-action="undo" title="Rückgängig">↶</button>
        <button type="button" data-action="redo" title="Wiederholen">↷</button>
        <button type="button" data-action="assets">Bilder</button>
        <button type="button" data-action="import">Import</button>
        <button type="button" data-action="code">HTML/CSS</button>
        <button type="button" data-action="preview">Vorschau</button>
        <button type="button" data-action="save" class="save-button">Speichern</button>
      </div>

      <div id="status" class="editor-status" role="status">Bereit</div>
    </header>

    <main class="workspace">
      <aside class="sidebar sidebar-left">
        <div class="sidebar-head">
          <div>
            <strong>Bausteine</strong>
            <span>Auf die Seite ziehen</span>
          </div>
        </div>
        <div id="blocks" class="manager-host blocks-host"></div>
        <div class="sidebar-help">
          <strong>Direkt bearbeiten</strong>
          <span>Element anklicken · Text doppelklicken · Stile rechts ändern · Strg+S speichert.</span>
        </div>
      </aside>

      <section class="canvas-column">
        <div class="canvas-toolbar">
          <div class="selection-state">
            <span>Auswahl</span>
            <strong id="selected-name">Nichts ausgewählt</strong>
          </div>
          <div class="selection-actions">
            <button type="button" data-action="select-parent" disabled>Eltern</button>
            <button type="button" data-action="duplicate" disabled>Duplizieren</button>
            <button type="button" data-action="delete" disabled>Löschen</button>
          </div>
        </div>
        <div id="gjs"></div>
      </section>

      <aside class="sidebar sidebar-right">
        <div class="inspector-tabs" role="tablist">
          <button type="button" class="is-active" data-inspector="styles">Stil</button>
          <button type="button" data-inspector="layers">Ebenen</button>
          <button type="button" data-inspector="traits">Eigenschaften</button>
        </div>
        <div class="inspector-body">
          <div id="styles" class="manager-host inspector-pane is-active"></div>
          <div id="layers" class="manager-host inspector-pane"></div>
          <div id="traits" class="manager-host inspector-pane"></div>
        </div>
      </aside>
    </main>
  </div>

  <dialog id="code-dialog" class="code-dialog">
    <div class="code-dialog-head">
      <div>
        <strong>HTML / CSS</strong>
        <span>Direkte Bearbeitung der aktuellen Seite</span>
      </div>
      <button type="button" data-code-close>Schließen</button>
    </div>
    <div class="code-editors">
      <label><span>HTML</span><textarea id="code-html" spellcheck="false"></textarea></label>
      <label><span>CSS</span><textarea id="code-css" spellcheck="false"></textarea></label>
    </div>
    <div class="code-dialog-actions">
      <button type="button" data-code-close>Abbrechen</button>
      <button type="button" id="code-apply" class="save-button">Übernehmen</button>
    </div>
  </dialog>

  <script src="node_modules/grapesjs/dist/grapes.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
