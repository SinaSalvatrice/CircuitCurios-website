<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CircuitCurios Webeditor</title>
<link rel="stylesheet" href="/editor.css">
<script defer src="/editor.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">CircuitCurios · Webeditor</div>
    <div class="muted">Hugo Content Engine</div>
    <div class="toolbar"><button class="btn primary" id="new">+ Neu</button></div>
    <input id="search" class="search" placeholder="Oberflächen filtern">
    <div id="texture-list" class="list"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="tabs">
        <button class="tab active" data-tab="texture">Oberfläche</button>
        <button class="tab" data-tab="site">Website</button>
      </div>
      <div id="status" class="status">gespeichert</div>
    </div>
    <section class="stage">
      <div class="panel active" data-panel="texture">
        <article class="preview-card">
          <div class="preview-image"><img id="p-image" alt=""></div>
          <div class="preview-copy">
            <div class="eyebrow">Oberflächenidentität</div>
            <h1 id="p-title"></h1>
            <div class="meta" id="p-meta"></div>
            <p id="p-principle"></p>
            <p class="description" id="p-description"></p>
          </div>
        </article>
      </div>
      <div class="panel" data-panel="site"><iframe id="site-frame" class="site-frame" title="Website Vorschau"></iframe></div>
    </section>
  </main>

  <aside class="inspector" id="inspector">
    <h2>Eigenschaften</h2>
    <label class="field"><span>Name</span><input id="f-title"></label>
    <div class="row">
      <label class="field"><span>Gruppe</span><input id="f-group"></label>
      <label class="field"><span>Familie</span><input id="f-family"></label>
    </div>
    <label class="field"><span>Struktur</span><input id="f-pattern"></label>
    <label class="field"><span>Entstehungsprinzip</span><textarea id="f-principle"></textarea></label>
    <label class="field"><span>Beschreibung</span><textarea id="f-description"></textarea></label>
    <label class="field"><span>Bild</span><input id="f-image"></label>
    <button class="btn full" id="pick-image">Bild auswählen</button>
    <label class="field"><span>Quellseite</span><input id="f-source"></label>
    <div class="sep"></div>
    <button class="btn primary full" id="save">Speichern</button>
    <p class="muted">Strg+S speichert. Die Live-Website bleibt normales HTML.</p>
  </aside>
</div>
<div id="toast" class="toast"></div>
</body>
</html>
