      }
    };

    const transitionStates = (element, config) => {
      const distance = Number(config.distance || 32);
      const effect = config.effect || 'fadeSlide';
      const direction = config.direction || 'bottom';
      const rotation =
        getComputedStyle(element).getPropertyValue('--cc-rotation').trim() ||
        '0rad';
      const parsedOpacity = Number.parseFloat(getComputedStyle(element).opacity);
      const targetOpacity = Number.isFinite(parsedOpacity) ? parsedOpacity : 1;
      let x = 0;
      let y = 0;
      if (direction === 'left') x = -distance;
      if (direction === 'right') x = distance;
      if (direction === 'top') y = -distance;
      if (direction === 'bottom') y = distance;
      const moves = effect === 'slide' || effect === 'fadeSlide' || effect === 'rise';
      const fades = effect === 'fade' || effect === 'fadeSlide' || effect === 'rise' || effect === 'blur' || effect === 'bounce';
      const scale = effect === 'scale' ? Number(config.scaleFrom || .96) : 1;
      let startClip = 'inset(0)';
      if (effect === 'reveal') {
        startClip = 'inset(100% 0 0 0)';
        if (direction === 'left') startClip = 'inset(0 100% 0 0)';
        if (direction === 'right') startClip = 'inset(0 0 0 100%)';
        if (direction === 'top') startClip = 'inset(0 0 100% 0)';
      }
      return {
        start: {
          opacity: fades ? 0 : targetOpacity,
          transform: 'rotate(' + rotation + ') translate(' + (moves ? x : 0) + 'px,' + (moves ? y : 0) + 'px) scale(' + scale + ')',
          filter: effect === 'blur' ? 'blur(14px)' : 'none',
          clipPath: startClip
        },
        end: {
          opacity: targetOpacity,
          transform: 'rotate(' + rotation + ') translate(0px,0px) scale(1)',
          filter: 'none',
          clipPath: 'inset(0)'
        }
      };
    };

    const runAnimation = async (controller, target, frames, options) => {
      if (controller.cancelled || !target.animate) return;
      const animation = target.animate(frames, options);
      controller.animations.add(animation);
      try { await animation.finished; } catch (_) {}
      controller.animations.delete(animation);
    };

    const cancelTransition = element => {
      const controller = transitionControllers.get(element);
      if (!controller) return;
      controller.cancelled = true;
      controller.animations.forEach(animation => animation.cancel());
      controller.animations.clear();
      transitionControllers.delete(element);
      if (element.classList.contains('cc-gallery-sequence')) {
        element.classList.remove('cc-gallery-sequence');
        element.querySelectorAll('.cc-tm-gallery-field').forEach(field => { field.style.opacity = ''; });
      }
    };

    const runImageSequence = async (element, config, controller) => {
      const fields = Array.from(element.querySelectorAll('.cc-tm-gallery-field'));
      if (!fields.length) return;
      const duration = Math.max(0, Number(config.durationMs || 350));
      const hold = Math.max(0, Number(config.sequenceHoldMs ?? 2200));
      const delay = Math.max(0, Number(config.delayMs || 0));
      const pause = Math.max(0, Number(config.loopPauseMs || 0));
      const loop = config.loop === true;
      const easing = easingValue(config.easing);
      element.classList.add('cc-gallery-sequence');
      fields.forEach(field => { field.style.opacity = '0'; });
      if (delay > 0) await wait(delay);
      do {
        for (let index = 0; index < fields.length; index += 1) {
          if (controller.cancelled) return;
          const field = fields[index];
          await runAnimation(controller, field, [{ opacity: 0 }, { opacity: 1 }], { duration, easing, fill: 'forwards' });
          if (controller.cancelled) return;
          if (hold > 0) await wait(hold);
          const finalFrame = index === fields.length - 1;
          if (finalFrame && !loop) { field.style.opacity = '1'; return; }
          await runAnimation(controller, field, [{ opacity: 1 }, { opacity: 0 }], { duration, easing, fill: 'forwards' });
        }
        if (loop && pause > 0) await wait(pause);
      } while (loop && !controller.cancelled);
    };

    const runGenericTransition = async (element, config, controller) => {
      const duration = Math.max(0, Number(config.durationMs || 350));
      const delay = Math.max(0, Number(config.delayMs || 0));
      const pause = Math.max(0, Number(config.loopPauseMs || 0));
      const loop = config.loop === true;
      const easing = config.effect === 'bounce' ? easingValue('overshoot') : easingValue(config.easing);
      const states = transitionStates(element, config);
      const options = { duration, easing, fill: 'forwards' };
      if (delay > 0) await wait(delay);
      do {
        if (controller.cancelled) return;
        await runAnimation(controller, element, [states.start, states.end], options);
        if (!loop || controller.cancelled) return;
        if (pause > 0) await wait(pause);
        await runAnimation(controller, element, [states.end, states.start], options);
        if (pause > 0) await wait(pause);
      } while (!controller.cancelled);
    };

    const startTransition = (element, config) => {
      cancelTransition(element);
      const controller = { cancelled: false, animations: new Set() };
      transitionControllers.set(element, controller);
      const runner = config.effect === 'imageSequenceFade' ? runImageSequence(element, config, controller) : runGenericTransition(element, config, controller);
      runner.catch(() => {});
    };

    const viewport = [];
    document.querySelectorAll('[data-cc-transition]').forEach(element => {
      const config = transitionConfig(element);
      if (!config) return;
      if (config.trigger === 'pageLoad') {
        requestAnimationFrame(() => startTransition(element, config));
      } else {
        viewport.push([element, config]);
      }
    });

    if (viewport.length) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const pair = viewport.find(item => item[0] === entry.target);
          if (!pair) return;
          const config = pair[1];
          if (entry.isIntersecting) {
            startTransition(entry.target, config);
            if (config.once !== false && config.loop !== true) observer.unobserve(entry.target);
          } else if (config.once === false || config.loop === true) {
            cancelTransition(entry.target);
          }
        });
      }, { threshold: .12 });
      viewport.forEach(item => observer.observe(item[0]));
    }
  })();
  </script>
